# Training arguments for the RecAMPLIFY runs (100 K steps, token-budget batching).

output_dir: logs/${now:%Y-%m-%d-%H-%M-%S}
resume_from_checkpoint: true

# Training control
max_steps: 100000
eval_steps: 1000
logging_steps: 100
save_steps: 1000
save_total_limit: 10

# Weight on the ponder cost (\beta in the paper), ramped linearly to this value
# over scheduler.num_warmup_steps. Ignored when model.use_ponder_act is false.
beta: 0.05

# Optimizer
optimizer:
  type: AdamW
  lr: 1e-3
  betas: [0.9, 0.95]
  eps: 1e-8
  weight_decay: 0.01
  fused: true
  max_grad_norm: 1.0
gradient_accumulation_steps: 8

# Scheduler
scheduler:
  type: cosine_with_min_lr
  num_warmup_steps: 1000
  num_training_steps: 90000
  kwargs:
    min_lr_rate: 0.1

# Hardware
tf32: true
disable_tqdm: false

# torch.compile. "max-autotune-no-cudagraphs" benchmarks kernel variants without CUDA
# graphs, which packed batches cannot use because their shape changes every step.
# Watch train/tokens_per_second to see the effect.
compile: false
compile_mode: max-autotune-no-cudagraphs

# Data loading — token-budget batching, so batch_size must be null.
per_device_train_batch_size: null
per_device_train_batch_tokens: 32768
per_device_eval_batch_size: null
per_device_eval_batch_tokens: 32768
dataloader_num_workers: 4
dataloader_drop_last: true
dataloader_persistent_workers: true
dataloader_pin_memory: true
dataloader_prefetch_factor: 4

# Data collator. packing=true selects the FlashAttention varlen path.
mlm: true
mlm_probability: 0.15
max_length: 512
packing: true
pad_to_multiple_of: 8
random_truncate: true
exclude_special_tokens_from_masking: true

# Custom (Hugging Face checkpoint management)
hf_save_steps: 10000
