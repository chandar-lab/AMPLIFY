# The Defaults List is a list in an input config that instructs Hydra how to build the output config.
defaults:
  - data: base
  - model:
    - amplify
    - 350M
    - tokenizer
  - training_args: base
  - _self_

seed: 42

hydra:
  run:
    dir: ${training_args.output_dir}/hydra

wandb:
  name: null
  project: amplify
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: []
  dir: ${training_args.output_dir}/wandb
  mode: offline