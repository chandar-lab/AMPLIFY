tokenizer:
  vocab:
    - "<pad>"
    - "<unk>"
    - "<mask>"
    - "<bos>"
    - "<eos>"
    - "|"
    - "X"
    - "B"
    - "O"
    - "U"
    - "Z"
    - "J"
    - "L"
    - "A"
    - "G"
    - "V"
    - "S"
    - "E"
    - "R"
    - "T"
    - "I"
    - "D"
    - "P"
    - "K"
    - "Q"
    - "N"
    - "F"
    - "Y"
    - "M"
    - "H"
    - "W"
    - "C"
  vocab_size: 32
  pad_token: "<pad>"
  unk_token: "<unk>"
  mask_token: "<mask>"
  bos_token: "<bos>"
  eos_token: "<eos>"
  other_special_tokens: null
  ambiguous_tokens:
    - "<unk>"
    - "X"
    - "B"
    - "O"
    - "U"
    - "Z"
    - "J"
  remove_ambiguous: true
