[project]
name = "plm_interpretability"
dynamic = ["version"]
description = "Code for interpretability of protein language models"
authors = [
    { name = "Shawn Whitfield", email = "shawn.whitfield@mila.quebec" },
]
dependencies = [
    "torch==2.4.1",
    "hydra-core>=1.3.2",
    "hydra-submitit-launcher>=1.2.0",
    "wandb>=0.17.6",
    "lightning>=2.4.0", # todo: would probably be hard to remove as a dependency.
    "torchvision>=0.19.0",
    "rich>=13.7.1",
    "tqdm>=4.66.5",
    "hydra-zen==0.13.1rc1",
    "matplotlib>=3.9.2",
    "optree>=0.15.0",
    "transformers>=4.44.0",
    "datasets>=2.21.0",
    # Hydra / submitit plugins
    "hydra-colorlog>=1.2.0",
    "remote-slurm-executor",
    "hydra-auto-schema>=0.0.7",
    "hydra-orion-sweeper>=1.6.4 ; python_full_version < '3.11'",
    "ipykernel>=6.30.1",
    "biopython>=1.85",
    "goatools>=1.4.12",
    "einops>=0.8.1",
    "polars>=1.32.3",
    "strs>=0.4.2",
    "scikit-learn>=1.7.1",
    "seaborn>=0.13.2",
    "xformers>=0.0.28.post1",
    "hatchling>=1.27.0",
    "plotly>=6.3.0",
    "dash>=3.2.0",
    "dash-bio>=1.0.2",
    "nbformat>=5.10.4",
    "py3dmol>=2.5.2",
    "huggingface-hub[cli]>=0.26.1",
    "ipywidgets>=8.1.7",
    "torchmetrics>=1.5.0",
    "graphviz>=0.21",
    "pydot>=4.0.1",
    "umap-learn>=0.5.9.post2",
    "scikit-posthocs>=0.11.4",
    "biotite>=1.5.0",
    "ridgeplot>=0.5.0",
    "iterative-stratification>=0.1.9",
    "deepspeed>=0.18.3",
    "scikit-multilearn>=0.2.0",
    "colorcet>=3.1.0",
]
readme = "README.md"
requires-python = ">= 3.12"

[dependency-groups]
dev = [
    "mktestdocs>=0.2.2",
    "pre-commit<4.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=5.0.0",
    "pytest-env>=1.1.3",
    "pytest-regressions>=2.5.0",
    "pytest-skip-slow>=0.0.5",
    "pytest-testmon>=2.1.1",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.6.1",
    "pytest>=8.3.2",
    "ruff>=0.6.0",
    "tensor-regression>=0.0.8",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]>=0.4.31; sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["project", "tests"]
norecursedirs = [".venv"]

# Required to use torch deterministic mode.
env = ["CUBLAS_WORKSPACE_CONFIG=:4096:8"]
addopts = [
    "--doctest-modules",
]
markers = [
    "incremental: incremental testing support",
    "parametrize_when_used: Parametrize a test only when the argument is used.",
]

[tool.ruff]
line-length = 99
indent-width = 4
# Add the pyupgrade and isort options in addition to the defaults.
lint.select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.uv]
managed = true

[tool.uv.sources]
remote-slurm-executor = { git = "https://github.com/lebrice/remote-slurm-executor", branch = "master" }


[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["project"]

[tool.hatch.version]
source = "uv-dynamic-versioning"
